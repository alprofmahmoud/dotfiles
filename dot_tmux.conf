# ============================================
# General Settings
# ============================================
# Change prefix from Ctrl+B to Ctrl+A (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support (click to switch panes, scroll, resize)
set -g mouse off

# Start window numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Increase scrollback history limit
set -g history-limit 10000

# Easier pane splitting shortcuts
bind | split-window -h
bind - split-window -v

# Quickly reload tmux config without restarting
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Enable 256 color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Allow tmux to pass through environment variable
set -g update-environment "DISPLAY XAUTHORITY DBUS_SESSION_BUS_ADDRESS"
set -g allow-passthrough on
set -g set-clipboard on

# Change default message colors
set -g message-style fg="#002b36",bg="#268bd2",bold

# ============================================
# Solarized Color Palette (true hex values)
# ============================================
# base03  #002b36  (darkest bg)
# base02  #073642  (dark bg highlights)
# base01  #586e75  (comments / secondary content)
# base00  #657b83  (body text - dark theme)
# base0   #839496  (body text - light theme)
# base1   #93a1a1  (optional emphasis)
# base2   #eee8d5  (light bg highlights)
# base3   #fdf6e3  (lightest bg)
# yellow  #b58900
# orange  #cb4b16
# red     #dc322f
# magenta #d33682
# violet  #6c71c4
# blue    #268bd2
# cyan    #2aa198
# green   #859900

# ============================================
# Status Bar - General
# ============================================
set -g status-position bottom
set -g status-style bg="#073642",fg="#839496"
set -g status-interval 5

# ============================================
# Status Bar - Left Side (Session Name)
# ============================================
set -g status-left-length 30
set -g status-left '#[fg="#002b36",bg="#268bd2",bold] #S #[fg="#268bd2",bg="#073642",nobold]'

# ============================================
# Status Bar - Right Side (Git Branch + Date/Time)
# ============================================
set -g status-right-length 90
set -g status-right '#{prefix_highlight} #[fg="#586e75"]#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null | sed "s/^/ /") #[fg="#073642",bg="#268bd2"]#[fg="#002b36",bg="#268bd2",bold] %Y-%m-%d  %H:%M '

# ============================================
# Window Status (Tabs)
# ============================================
setw -g window-status-format ' #I:#W '
setw -g window-status-style fg="#586e75",bg="#073642"

setw -g window-status-current-format ' #I:#W '
setw -g window-status-current-style fg="#002b36",bg="#268bd2",bold

# ============================================
# Pane Borders
# ============================================
set -g pane-border-style fg="#073642"
set -g pane-active-border-style fg="#268bd2"

# ============================================
# Messages
# ============================================
set -g message-style fg="#002b36",bg="#268bd2",bold

# ============================================
# Navigate panes with h/j/k/l instead of arrow keys
# ============================================
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize panes with Shift + h/j/k/l
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================
# Allow OSC52 clipboard to pass through tmux
# ============================================
set -g set-clipboard on
set -as terminal-features ',xterm-256color:clipboard'

# ============================================
# Plugin List (managed by tpm)
# ============================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-copycat'

# ============================================
# Plugin Configuration (managed by tpm)
# ============================================
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize tpm (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
set-option -g default-shell /bin/zsh
